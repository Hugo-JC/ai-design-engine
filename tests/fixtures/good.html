<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio Tinta Viva</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--sf:#141414;--ink:#F5F1E8;--mut:#A3A3A3;--ac:#EF4444}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 Inter,sans-serif}
h1,h2{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.01em;text-wrap:balance}
section{padding:96px 48px}
.btn{background:var(--ac);color:#0A0A0A;padding:16px 32px;border-radius:6px;border:0;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
p.lead{color:var(--mut)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<h1>Tinta que fica na pele, não no ecrã</h1>
<section><h2>Sessões de 3&nbsp;h</h2><p class="lead">Marcação com sinal de 30&nbsp;€ e desenho aprovado antes de agulhas.</p>
<a class="btn" href="#marcar">Marcar sessão</a></section>
<img src="trabalho.jpg" alt="Braço com tatuagem de linhas finas">
</body>
</html>
